name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Verified Agent Identity repo
        run: |
          mkdir -p skills
          git clone https://github.com/BillionsNetwork/verified-agent-identity.git skills/verified-agent-identity
          ls -la skills/verified-agent-identity

      - name: Install dependencies locally
        run: |
          cd skills/verified-agent-identity
          npm init -y
          npm install ethers uuid cross-fetch shell-quote @0xpolygonid/js-sdk

      - name: Check scripts
        run: |
          ls -la skills/verified-agent-identity/scripts

      - name: Create Ethereum Identity
        run: |
          node skills/verified-agent-identity/scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node skills/verified-agent-identity/scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Show verification instruction
        run: |
          echo "Jika tidak ada error berarti berhasil."
          echo "Cari link seperti:"
          echo "https://wallet.billions.network#challenge=..."
          echo "Buka link tersebut dan sign di wallet."
