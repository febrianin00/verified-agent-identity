name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4   # upgrade ke v4 lebih aman & cepat

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'               # optional: cache node_modules biar lebih cepat run ulang

      - name: Install ClawHub CLI
        run: npm install -g clawhub@latest   # pakai @latest biar selalu dapat versi terbaru

      - name: Install Verified Agent Identity skill
        run: clawhub install verified-agent-identity
        # Catatan: Ini akan install ke folder ./skills/verified-agent-identity (default behavior ClawHub)

      - name: Install dependencies for the skill
        run: |
          cd skills/verified-agent-identity
          npm install

      - name: Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}' 

      # Optional: Tambah step ini kalau ingin lihat output/link verifikasi
      - name: Show possible verification link (manual check)
        run: echo "Cek log di atas — biasanya ada link verifikasi seperti https://wallet.billions.network#..."
