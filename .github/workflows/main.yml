name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install required packages globally
        run: |
          npm install -g ethers uuid cross-fetch shell-quote @0xpolygonid/js-sdk

      - name: Clone Verified Agent Identity repo
        run: |
          mkdir -p skills
          git clone --depth 1 https://github.com/BillionsNetwork/verified-agent-identity.git skills/verified-agent-identity
          ls -la skills/verified-agent-identity

      - name: Check scripts folder
        run: |
          ls -la skills/verified-agent-identity/scripts

      - name: Create new Ethereum Identity
        run: |
          node skills/verified-agent-identity/scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node skills/verified-agent-identity/scripts/manualLinkHumanToAgent.js \
          --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Verification instructions
        run: |
          echo "SUCCESS jika tidak ada error"
          echo "Cari link seperti:"
          echo "https://wallet.billions.network#challenge=..."
          echo "Buka link tersebut dan sign di wallet."
