name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ClawHub CLI (optional, only if needed later)
        run: npm install -g clawhub@latest || echo "ClawHub install skipped or failed, continuing"

      - name: Clone Verified Agent Identity repo (fallback since clawhub may fail)
        run: |
          git clone https://github.com/BillionsNetwork/verified-agent-identity.git skills/verified-agent-identity
          ls -la skills/verified-agent-identity  # debug: pastikan folder ada

      - name: Install dependencies
        run: |
          cd skills/verified-agent-identity
          npm install
          # Install explicit deps yang sering dibutuhkan (dari README & user guides)
          npm install shell-quote @iden3/js-iden3-auth @0xpolygonid/js-sdk ethers uuid cross-fetch --save

      - name: Debug - List installed files
        run: |
          pwd
          ls -la skills/verified-agent-identity
          ls -la skills/verified-agent-identity/scripts || echo "Scripts folder not found!"

      - name: Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Show verification info
        run: |
          echo "Proses selesai! Cek output step 'Link Human to Agent' di atas."
          echo "Biasanya ada link verifikasi seperti: https://wallet.billions.network#challenge=..."
          echo "Copy link itu → buka di browser (wallet Billions Network) untuk verifikasi human ke agent."
          echo "Jika ada error di node scripts, paste log-nya untuk debug lanjut."
