name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (your workflow repo)
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone Verified Agent Identity repo directly
        run: |
          mkdir -p skills
          git clone https://github.com/BillionsNetwork/verified-agent-identity.git skills/verified-agent-identity
          echo "Cloned repo:"
          ls -la skills/verified-agent-identity

      - name: Install dependencies
        run: |
          cd skills/verified-agent-identity
          npm install
          # Tambah deps eksplisit dari repo (ethers, polygonid, dll.)
          npm install @0xpolygonid/js-sdk ethers uuid cross-fetch shell-quote --save

      - name: Debug - Check scripts folder
        run: |
          ls -la skills/verified-agent-identity/scripts || echo "Scripts folder missing!"

      - name: Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Show verification link instructions
        run: |
          echo "SUKSES jika tidak error di atas!"
          echo "Cek output step 'Link Human to Agent' — cari link seperti:"
          echo "https://wallet.billions.network#challenge=... atau #i_m=..."
          echo "Copy link lengkap itu → paste di browser (pastikan login Billions wallet jika perlu)."
          echo "Verifikasi selesai setelah sign/confirm di wallet → agent kamu verified di Billions Network."
