name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Tidak perlu cache di sini → repo kamu tidak punya package.json di root

      - name: Install ClawHub CLI
        run: npm install -g clawhub@latest

      - name: Install Verified Agent Identity skill
        run: clawhub install verified-agent-identity

      - name: Install dependencies for the skill
        run: |
          cd skills/verified-agent-identity || { echo "Folder skills/verified-agent-identity tidak ditemukan!"; exit 1; }
          npm install

      - name: Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Show possible verification link (manual check)
        run: |
          echo "Cek output di step 'Link Human to Agent' di atas."
          echo "Biasanya ada link verifikasi seperti https://wallet.billions.network#challenge=... "
          echo "Copy link itu → buka di browser/wallet untuk verifikasi human ke agent."
