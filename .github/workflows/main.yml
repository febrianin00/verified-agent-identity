name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ClawHub CLI
        run: npm install -g clawhub@latest

      - name: Install Verified Agent Identity skill
        run: clawhub install verified-agent-identity || echo "Install gagal, tapi lanjut untuk debug"

      - name: Debug - List files after install
        run: |
          pwd
          ls -la
          ls -la skills || echo "Folder skills tidak ada!"
          if [ -d "skills/verified-agent-identity" ]; then
            echo "Folder ditemukan!"
            ls -la skills/verified-agent-identity
          else
            echo "Folder verified-agent-identity TIDAK ditemukan!"
          fi

      - name: Install dependencies for the skill (with fallback)
        run: |
          if [ -d "skills/verified-agent-identity" ]; then
            cd skills/verified-agent-identity
            npm install
          else
            echo "Fallback: Clone repo langsung dari GitHub karena clawhub install gagal"
            git clone https://github.com/BillionsNetwork/verified-agent-identity.git skills/verified-agent-identity
            cd skills/verified-agent-identity
            npm install
            # Install deps manual yang dibutuhkan (dari contoh user lain)
            npm install shell-quote @iden3/js-iden3-auth @0xpolygonid/js-sdk ethers uuid cross-fetch
          fi

      - name: Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Show verification info
        run: |
          echo "Jika sukses, cek output step sebelumnya untuk link verifikasi (biasanya https://wallet.billions.network#...)"
          echo "Buka link itu di browser/wallet untuk verifikasi human → agent."
