name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'none'  # ← Ini yang fix error lock file

      - name: Install ClawHub CLI
        run: npm install -g clawhub@latest

      - name: Install Verified Agent Identity skill
        run: clawhub install verified-agent-identity
        # Install ke ./skills/verified-agent-identity

      - name: Install dependencies for the skill
        run: |
          cd skills/verified-agent-identity
          npm install

      - name: Create new Ethereum Identity
        run: |
          cd skills/verified-agent-identity
          node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          cd skills/verified-agent-identity
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"febrianin00","description":"febrianin00 AI Agent"}'

      - name: Show possible verification link (manual check)
        run: |
          echo "Cek log Actions di atas — biasanya script manualLinkHumanToAgent.js print link verifikasi seperti:"
          echo "https://wallet.billions.network#challenge=... atau sejenisnya"
          echo "Copy link itu dan buka di browser untuk verifikasi human → agent."
